<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Личный список — Свой адрес</title>
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script src="/common.js" defer></script>
  <script src="/auth-client.js" defer></script>
  <script src="/personal-client.js" defer></script>
  <script src="/personal.js" defer></script>
</head>
<body>
  <header class="header wrap">
    <a class="brand" href="/">⌂ свой адрес.</a>
    <nav id="account-nav" class="account-nav" aria-label="Аккаунт">Проверяем вход…</nav>
  </header>
  <p id="account-message" class="wrap form-message" role="status"></p>
  <main class="wrap detail-main">
    <a class="back-link" href="/#catalog">← В каталог</a>
    <h1 id="personal-title">Избранное</h1>
    <p id="personal-note" class="form-note"></p>
    <p id="personal-message" class="message" role="status">Загружаем объявления…</p>
    <button id="personal-retry" class="retry" type="button" hidden>Попробовать снова</button>
    <div id="personal-list" class="listing-grid" aria-busy="true"></div>
    <nav id="personal-pagination" class="pagination" aria-label="Страницы списка" hidden>
      <a id="personal-previous" class="page-link">← Назад</a>
      <span id="personal-summary"></span>
      <a id="personal-next" class="page-link">Далее →</a>
    </nav>
    <noscript><p>Для личного списка требуется JavaScript.</p></noscript>
  </main>
  <template id="listing-template">
    <article class="listing-card">
      <div class="card-image"><a class="cover-link" href="/"><img loading="lazy" alt=""></a><span class="deal-badge"></span><span class="photo-count"></span></div>
      <div class="card-content">
        <p class="district"></p><h3><a class="listing-link" href="/"></a></h3><p class="address"></p>
        <p class="features"></p><p class="description"></p>
        <div class="card-bottom"><p class="price"></p><span class="availability"><span class="small-dot"></span> Доступно</span></div>
      </div>
    </article>
  </template>
</body>
</html>
